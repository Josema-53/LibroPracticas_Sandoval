<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Funciones puras</title>
  </head>
  <body>
    <p>Abre la consola (F12): esta sección es de JavaScript y no carga React.</p>

    <script>
      const menuItem = {
        id: 1,
        iceCream: {
          id: 3,
          name: "Mora silvestre",
          imagePath: "images/mora.svg",
        },
        price: 1.5,
        description: "Mora de Ambato con un toque de limón.",
        inStock: true,
      };

      // Una función pura: mismo argumento, mismo resultado
      const formatPrice = (price) =>
        new Intl.NumberFormat("es-EC", {
          style: "currency",
          currency: "USD",
        }).format(price);

      console.log(formatPrice(1.5));
      console.log(formatPrice(1.5));

      // Fuga 1: mira algo de fuera
      let taxRate = 0.12;

      const priceWithTax = (price) => price * (1 + taxRate);

      console.log(formatPrice(priceWithTax(1.5)));
      taxRate = 0.15;
      console.log(formatPrice(priceWithTax(1.5)));

      // Fuga 2: toca lo que le dieron (muta)
      const applyDiscount = (item, percent) => {
        item.price = item.price * (1 - percent);
        return item;
      };

      console.log(formatPrice(menuItem.price));

      const enOferta = applyDiscount(menuItem, 0.2);

      console.log(formatPrice(enOferta.price));
      console.log(formatPrice(menuItem.price));

      // La versión pura: devuelve un objeto nuevo
      const withDiscount = (item, percent) => ({
        ...item,
        price: item.price * (1 - percent),
      });

      const rebajado = withDiscount(menuItem, 0.2);

      console.log(formatPrice(rebajado.price));
      console.log(formatPrice(menuItem.price));

      // La copia es superficial
      console.log(rebajado === menuItem);
      console.log(rebajado.iceCream === menuItem.iceCream);

      // ---------------------------------------------------------------
      // Practica 03-02: lo mismo, sobre un array
      // ---------------------------------------------------------------
      const menu = [menuItem];

      // Impura: muta el array que recibe
      const addItemPush = (menu, item) => {
        menu.push(item);
        return menu;
      };

      // Pura: devuelve un array nuevo
      const addItem = (menu, item) => [...menu, item];

      console.log("--- Practica: arrays ---");
      console.log("menu.length al empezar:", menu.length);

      const conSpread = addItem(menu, rebajado);
      console.log("con [...menu, item] → nuevo:", conSpread.length, "| menu.length:", menu.length);

      const conPush = addItemPush(menu, rebajado);
      console.log("con menu.push(item) → devuelto:", conPush.length, "| menu.length:", menu.length);
      console.log("¿push devolvió el mismo array?", conPush === menu);
    </script>
  </body>
</html>
