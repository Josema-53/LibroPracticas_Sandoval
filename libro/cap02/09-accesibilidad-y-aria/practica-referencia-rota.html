<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Heladería</title>
  </head>
  <body>
    <div id="root"></div>

    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>

    <script type="text/babel" data-type="module">
      import React from "https://esm.sh/react@19.2.0?dev";
      import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

      // Practica 02-09: el <h2> pasa a id="flavor-1" y el <article> sigue
      // señalando a "flavor-mora". Consola limpia, página idéntica, Name vacío.

      const menu = (
        <>
          <main>
            <h1>La Heladería</h1>

            <article className="menu-item" aria-labelledby="flavor-mora">
              <h2 id="flavor-1">Mora silvestre</h2>
              <p className="menu-item-description">
                Mora de Ambato con un toque de limón.
              </p>
            </article>

            <article className="menu-item" aria-labelledby="flavor-pistacho">
              <h2 id="flavor-pistacho">Pistacho</h2>
              <p className="menu-item-description">
                Sabor suave con pequeños trozos de pistacho.
              </p>
            </article>
          </main>

          <footer>
            <p>La Heladería -- Ambato</p>
          </footer>
        </>
      );

      createRoot(document.getElementById("root")).render(menu);
    </script>
  </body>
</html>
