<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Heladería</title>
  </head>
  <body>
    <!-- Demostración de la sección: HTML pegado dentro de JSX sin traducir.
         Produce los cuatro avisos de React y el campo deja de ser de solo lectura. -->
    <div id="root"></div>

    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>

    <script type="text/babel" data-type="module">
      import React from "https://esm.sh/react@19.2.0?dev";
      import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

      const field = (
        <>
          <label for="name-jsx">Nombre del sabor</label>
          <input id="name-jsx" maxlength="40" readonly class="field" />
        </>
      );

      createRoot(document.getElementById("root")).render(field);
    </script>
  </body>
</html>
